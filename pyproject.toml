[project]
name = "phish-setlist-maker"
version = "0.1.0"
description = "Trying to make a phish setlist predictor"
authors = [
    {name = "Sam Marshall",email = "samuel.r.marshall@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "numpy (>=2.1.2,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "fastparquet (>=2024.5.0,<2025.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "requests (>=2.32.3,<3.0.0)",
    "sqlalchemy-utils (>=0.41.2,<0.42.0)",
    "scikit-learn (>=1.5.2,<2.0.0)",
    "fastapi (>=0.115.2,<1.0.0)",
    "uvicorn (>=0.32.0,<1.0.0)",
    "matplotlib (>=3.9.2,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.2.5"
notebook = "^7.3.2"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
responses = "^0.25.3"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
markers = [
    "segue: tests for segue groups functionality (builder, feature store, generator integration)",
    "slow: long-running tests that exercise full generation flows",
]

[tool.poetry.scripts]
server = "phish_setlist_maker.api.cli:start_server"
http-start = "phish_setlist_maker.api.cli:start_server"
validate-segues = "scripts.validate_segues:main"
