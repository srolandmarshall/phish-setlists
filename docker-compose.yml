version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://phish:phish@db:5432/phish
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/analytics/features:/app/data/analytics/features:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=phish
      - POSTGRES_PASSWORD=phish
      - POSTGRES_DB=phish
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phish"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
