version: 1.0
runtime: python313
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  runtime-version: 3.13
  command: uvicorn phish_setlist_maker.api:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: PYTHONPATH
      value: "/app/src"
    - name: DATABASE_URL
      value: "postgresql://user:password@your-rds-endpoint:5432/phish"
